<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery GRANPRIS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>GRANPRIS</h1>
    <p>Uma vinícola focada em proporcionar bons momentos. </p>
</header>
<main>
    <h2>Nossos vinhos: </h2>
    <section>
        <h3>Catálogo de vinho </h3>

        <div class="vinhos">
            <div class="vinho">
                <h4>Laica</h4>
                <p>Um vinho especial, feito para se tomar com o seu amor! </p>
                <img src="imagens/laica.jpg" alt="Garrafa de vinho laica">
                <p>R$250,00</p>
                <button>Comprar</button>
            </div>
            <div class="vinho">
                <h4>Mel</h4>
                <p>Um vinho tão suave que parece mel.</p>
                <img src="imagens/mel.jpg" alt="Garrafa de vinho mel">
                <p>R$100,00</p>
                <button>Comprar</button>
            </div>
            <div class="vinho">
                <h4>Granpris</h4>
                <p>Este vinho vai fazer você viver experiências sem iguais </p>
                <img src="imagens/granpris.jpg" alt="Garrafa de vinho granpris">
                <p>R$300,00</p>
                <button>Comprar</button>
            </div>
        </div>

    </section>
</main>
<script src="script.js"></script>
</body>
</html>
